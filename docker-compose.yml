# THIS DOCKERFILE IS INTENDED FOR DEVELOPMENT ENVIRONMENTS
# DO NOT USE THIS FOR PRODUCTION USAGES.

services:
  postgresql:
    image: docker.io/bitnami/postgresql:latest
    ports:
      - "5432:5432"
    volumes:
      - "postgresql_data:/bitnami/postgresql"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_DATABASE=nestjs
      - POSTGRESQL_USERNAME=nestjs
      - POSTGRESQL_PASSWORD=password

  app:
    image: nest-app-stebin:latest
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://nestjs:password@postgresql:5432/nestjs
    depends_on:
      - postgresql

volumes:
  postgresql_data:
    driver: local
