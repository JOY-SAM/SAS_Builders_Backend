# THIS DOCKERFILE IS INTENDED FOR DEVELOPMENT ENVIRONMENTS
# DO NOT USE THIS FOR PRODUCTION USAGES.

services:
  postgresql:
    container_name: postgresql
    image: docker.io/bitnami/postgresql:latest
    ports:
      - "5432:5432"
    volumes:
      - "postgresql_data:/bitnami/postgresql"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_DATABASE=nestjs
      - POSTGRESQL_USERNAME=nestjs
      - POSTGRESQL_PASSWORD=password

  nestjs:
    container_name: nestjs
    build: .
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://nestjs:password@postgresql:5432/nestjs
    depends_on:
      - postgresql
    env_file:
      - .env

  studio:
    container_name: prisma-studio
    build:
      context: .
      target: builder
    ports:
      - "5555:5555"
    working_dir: /home/node
    environment:
      - POSTGRESQL_USERNAME=nestjs
      - POSTGRESQL_PASSWORD=password
      - POSTGRESQL_DATABASE=nestjs
      # Reconstruct the connection string for Prisma
      - DATABASE_URL=postgresql://nestjs:password@postgresql:5432/nestjs
    depends_on:
      - postgresql
    command: npx prisma studio

  migrate:
    container_name: prisma-migrate
    build:
      context: .
      target: builder
    environment:
      - DATABASE_URL=postgresql://nestjs:password@postgresql:5432/nestjs
    command: npx prisma db push
    depends_on:
      - postgresql
    restart: on-failure

volumes:
  postgresql_data:
    driver: local
