services:
  postgresql:
    container_name: postgresql_prod
    image: docker.io/bitnami/postgresql:latest
    ports:
      - "5432:5432"
    volumes:
      - "postgresql_data_prod:/bitnami/postgresql"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRESQL_DATABASE=${DB_NAME}

    restart: always
    env_file:
      - .env

  nestjs:
    container_name: nestjs_prod
    build:
      context: .
      target: production
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgresql_prod:5432/${DB_NAME}
    depends_on:
      - postgresql
    env_file:
      - .env
    restart: always

volumes:
  postgresql_data_prod:
    driver: local
