version: "3.8"

services:
  postgresql:
    container_name: postgresql_prod
    image: docker.io/bitnami/postgresql:latest
    ports:
      - "5432:5432"
    volumes:
      - "postgresql_data_prod:/bitnami/postgresql"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always
    env_file:
      - .env

  nestjs:
    container_name: nestjs_prod
    build:
      context: .
      target: production
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql_prod:5432/${POSTGRES_DB}
    depends_on:
      - postgresql
    env_file:
      - .env
    restart: always

volumes:
  postgresql_data_prod:
    driver: local
