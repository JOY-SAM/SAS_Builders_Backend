name: Deploy to AWS EC2

on:
  push:
    branches:
      - prod

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    environment: 'CI/CD EC2'


    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Fail on any error
            set -e

            # Navigate to project directory
            cd ${{ secrets.PROJECT_PATH }}
            
            # Match the remote exactly using SSH (requires deploy key)
            git fetch git@github.com:${{ github.repository }}.git prod
            
            # Reset to match remote exactly (discards local changes)
            # Use FETCH_HEAD to refer to the commit we just fetched
            git reset --hard FETCH_HEAD
            
            # Update .env file safely
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF
            
            # Restart containers (Build & Run in detached mode)
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            
            # Cleanup unused images safely (keep last 72h)
            docker image prune -f --filter "until=72h"
