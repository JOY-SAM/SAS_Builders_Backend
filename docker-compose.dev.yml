version: "3.8"

services:
  postgresql:
    container_name: postgresql
    image: docker.io/bitnami/postgresql:latest
    ports:
      - "5432:5432"
    volumes:
      - "postgresql_data:/bitnami/postgresql"
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_DATABASE=nestjs
      - POSTGRESQL_USERNAME=nestjs
      - POSTGRESQL_PASSWORD=password

  nestjs:
    container_name: nestjs
    build:
      context: .
      target: development
    ports:
      - "3001:3001"
      - "9229:9229" # Debug port
    environment:
      - DATABASE_URL=postgresql://nestjs:password@postgresql:5432/nestjs
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - postgresql
    env_file:
      - .env

  studio:
    container_name: prisma-studio
    build:
      context: .
      target: development
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://nestjs:password@postgresql:5432/nestjs
    depends_on:
      - postgresql
    command: npx prisma studio
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  migrate:
    container_name: prisma-migrate
    build:
      context: .
      target: development
    environment:
      - DATABASE_URL=postgresql://nestjs:password@postgresql:5432/nestjs
    command: npx prisma db push
    depends_on:
      - postgresql
    restart: on-failure
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  postgresql_data:
    driver: local
